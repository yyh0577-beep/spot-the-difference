<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>달라진 그림 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--panel:#16161d;--line:#2a2a35;--ink:#f3f1ec;--dim:#9a98a6;--red:#e5233a;--red2:#8f1222;--ok:#2fd17a;--bad:#ff5d6c}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a0d14 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,.disp{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.01em;margin:0;line-height:1.08}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(14px,3vw,32px)}
.btn{min-height:48px;padding:10px 22px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.red{background:linear-gradient(180deg,var(--red),var(--red2));border-color:#ff4b5f;color:#fff;box-shadow:0 6px 24px #e5233a44}
.btn.big{min-height:64px;font-size:20px;padding:12px 34px}
.btn:disabled{opacity:.4;cursor:default}
input,select{min-height:52px;border-radius:12px;border:1px solid var(--line);background:#0f0f15;padding:8px 14px;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.5vw,28px)}
.muted{color:var(--dim)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* title screen */
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.hero h1{font-size:clamp(44px,9vw,96px);text-shadow:0 0 40px #e5233a66}
.hero h1 b{color:var(--red);font-weight:400}
.hero .rules{max-width:560px;margin:18px auto 30px;color:var(--dim);font-size:17px}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,260px));gap:16px;justify-content:center}
.choice .btn{min-height:96px;font-size:22px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.choice .btn small{font-weight:400;font-size:14px;color:var(--dim)}
.choice .btn.red small{color:#ffd9de}
/* stage image */
.stage{position:relative;width:100%;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 20px 60px #0009;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mk{fill:#ffffff22;stroke:#fff;stroke-width:3;vector-effect:non-scaling-stroke}
.mk.ok{stroke:var(--ok);fill:#2fd17a33}.mk.bad{stroke:var(--bad);fill:#ff5d6c33}
.mkn{fill:#fff;font-family:"Noto Sans KR",sans-serif;font-weight:900;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#000;stroke-width:.5px;pointer-events:none}
.ans{fill:none;stroke:var(--red);stroke-width:5;vector-effect:non-scaling-stroke;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw .9s ease-out forwards}
.dot{fill:#ffe14a;opacity:.75}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ans{animation:none;stroke-dashoffset:0}}
/* top bar */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.bar .phase{font-family:"Black Han Sans";font-size:clamp(22px,3vw,34px)}
.bar .sp{flex:1}
.clock{font-family:"Black Han Sans";font-size:clamp(34px,5vw,60px);font-variant-numeric:tabular-nums;color:#fff;line-height:1}
.clock.hot{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.meter{height:8px;background:#ffffff14;border-radius:9px;overflow:hidden;margin:0 0 14px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8a5b);width:100%;transition:width .25s linear}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#ffffff10;border:1px solid var(--line);font-weight:700;white-space:nowrap}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px}
@media(max-width:860px){.lobby{grid-template-columns:minmax(0,1fr)}}
.code{font-family:"Black Han Sans";font-size:clamp(64px,10vw,120px);letter-spacing:.12em;color:#fff;line-height:1;text-shadow:0 0 30px #e5233a88}
.qr{background:#fff;border-radius:12px;padding:10px;width:min(240px,100%);margin:14px 0}
.qr svg{display:block;width:100%;height:auto}
.url{word-break:break-all;font-size:14px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:48px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-radius:999px;background:#ffffff0e;border:1px solid var(--line);font-weight:700}
.chip.off{opacity:.4}
.chip button{border:0;background:#ffffff14;border-radius:50%;width:28px;height:28px;cursor:pointer;color:var(--dim)}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.rbtn{position:relative;aspect-ratio:16/10;border-radius:12px;border:2px solid var(--line);overflow:hidden;cursor:pointer;padding:0;background:#000}
.rbtn img{width:100%;height:100%;object-fit:cover;opacity:.55}
.rbtn span{position:absolute;inset:auto 0 0 0;padding:6px;background:linear-gradient(transparent,#000c);font-family:"Black Han Sans";font-size:20px}
.rbtn.done{border-color:#3a3a46}.rbtn.done img{filter:grayscale(1);opacity:.3}
.rbtn.done::after{content:"완료";position:absolute;top:6px;right:6px;font-size:12px;font-weight:700;background:#000a;padding:2px 8px;border-radius:9px}
.rbtn:hover,.rbtn:focus-visible{border-color:var(--red)}
.settings{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}
/* results */
.res{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.res{grid-template-columns:minmax(0,1fr)}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--dim);font-weight:400;font-size:14px}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
td:first-child{font-family:"Black Han Sans";font-size:20px;color:var(--dim)}
tr.top1 td{color:#fff}tr.top1 td:first-child{color:var(--red)}
.board{max-width:820px;margin:0 auto}
.board h2{font-size:clamp(40px,6vw,72px);text-align:center;margin:10px 0 22px}
.brow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;opacity:0;transform:translateY(12px);animation:rise .45s forwards}
.brow .n{font-family:"Black Han Sans";font-size:30px;color:var(--dim)}
.brow .nm{font-size:22px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .pt{font-family:"Black Han Sans";font-size:30px}
.brow.g1{background:linear-gradient(90deg,#4a0e18,var(--panel));border-color:var(--red)}.brow.g1 .n{color:var(--red)}
@keyframes rise{to{opacity:1;transform:none}}
/* player */
.pl{max-width:1100px;margin:0 auto;padding:12px}
.pl .bar{margin-bottom:8px}
.pl .clock{font-size:40px}
.big-msg{min-height:70vh;display:grid;place-items:center;text-align:center}
.big-msg h2{font-size:clamp(34px,8vw,60px);margin-bottom:10px}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.count{font-family:"Black Han Sans";font-size:28px}
.count b{color:var(--red);font-weight:400}
.score{font-family:"Black Han Sans";font-size:clamp(56px,14vw,110px);line-height:1}
.rot{display:none;text-align:center;margin:8px 0 0;font-size:14px}
@media(orientation:portrait) and (max-width:600px){.rot{display:block}}
@media(orientation:landscape) and (max-height:500px){.pl{padding:6px}.pl .bar{margin-bottom:2px}.pl .clock{font-size:28px}.meter{margin-bottom:6px}#pStage{max-height:calc(100vh - 110px);width:auto;max-width:100%}.tools{margin-top:6px}.btn.big{min-height:48px;font-size:17px}}
.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:#000d;border:1px solid var(--line);font-size:14px;z-index:20}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:30;padding:20px}
.modal .card{max-width:420px;width:100%;text-align:center}
.modal p{font-size:18px;margin:0 0 18px}
.join{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.join input{text-align:center;font-size:24px}
#pCode{letter-spacing:.3em;font-family:"Black Han Sans"}
@media(max-width:600px){.choice{grid-template-columns:minmax(0,1fr)}.bar .phase{font-size:22px}}
</style>
</head>
<body>

<!-- ===== 시작 화면 ===== -->
<section id="vHome" class="hero">
  <div>
    <h1>달라진 <b>그림</b> 찾기</h1>
    <p class="rules">그림을 기억하세요. 그림이 바뀌면 달라진 곳을 터치하세요.<br>최대 5개까지 표시할 수 있어요. 맞히면 +1점, 틀리면 −1점.</p>
    <div class="choice">
      <button class="btn red" id="goHost">선생님<small>방 만들고 진행하기 (큰 화면)</small></button>
      <button class="btn" id="goPlay">참가하기<small>코드 입력하고 들어가기</small></button>
    </div>
  </div>
</section>

<!-- ===== 선생님 화면 ===== -->
<section id="vHost" class="wrap hide">
  <div class="bar">
    <span class="phase" id="hPhase">대기실</span>
    <span class="pill" id="hCodeSm"></span>
    <span class="pill" id="hCount">참가 0명</span>
    <span class="sp"></span>
    <span class="clock" id="hClock"></span>
  </div>
  <div class="meter hide" id="hMeter"><i></i></div>

  <div id="hLobby" class="lobby">
    <div class="card">
      <div class="muted">입장 코드</div>
      <div class="code" id="hCode">----</div>
      <div class="qr" id="hQr"></div>
      <div class="url" id="hUrl"></div>
    </div>
    <div class="card">
      <h2 style="font-size:28px">참가자 <span class="muted" id="hN" style="font-family:inherit"></span></h2>
      <div class="chips" id="hChips"><span class="muted">QR을 찍거나 코드를 입력하면 여기 이름이 나타나요.</span></div>
      <div class="settings" style="margin-top:22px">
        <label>기억하는 시간<select id="sMemo"><option value="30">30초</option><option value="60">1분</option><option value="90">1분 30초</option><option value="120" selected>2분</option><option value="180">3분</option></select></label>
        <label>찾는 시간<select id="sFind"><option value="30">30초</option><option value="45">45초</option><option value="60" selected>1분</option><option value="90">1분 30초</option><option value="120">2분</option></select></label>
      </div>
      <h2 style="font-size:24px;margin-top:22px">라운드 시작</h2>
      <div class="rounds" id="hRounds"></div>
      <div class="row" style="margin-top:18px">
        <button class="btn" id="hShowBoard">종합 순위 보기</button>
        <button class="btn" id="hReset">점수 초기화</button>
        <button class="btn" id="hNew">새 방 만들기</button>
      </div>
    </div>
  </div>

  <div id="hPlay" class="hide">
    <div class="stage" id="hStage"></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <span class="pill" id="hSub"></span>
      <button class="btn" id="hSkip">다음 단계로 →</button>
    </div>
  </div>

  <div id="hReveal" class="res hide">
    <div><div class="stage" id="hRStage"></div><p class="muted" style="margin:8px 2px">노란 점 = 아이들이 표시한 곳</p></div>
    <div class="card">
      <h2 style="font-size:28px;margin-bottom:8px" id="hRTitle">라운드 결과</h2>
      <table><thead><tr><th>순위</th><th>이름</th><th>정답</th><th>오답</th><th>점수</th><th>시간</th></tr></thead><tbody id="hRTable"></tbody></table>
      <div class="row" style="margin-top:16px"><button class="btn red big" id="hToBoard">종합 순위 →</button></div>
    </div>
  </div>

  <div id="hBoard" class="board hide">
    <h2>종합 순위</h2>
    <div id="hBList"></div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn red big" id="hToLobby">라운드 선택으로</button></div>
  </div>
</section>

<!-- ===== 학생 화면 ===== -->
<section id="vPlay" class="pl hide">
  <div id="pJoin" class="big-msg">
    <div class="join">
      <h2>입장하기</h2>
      <input id="pCode" inputmode="numeric" maxlength="4" placeholder="코드 4자리" autocomplete="off">
      <input id="pName" maxlength="10" placeholder="이름" autocomplete="off">
      <button class="btn red big" id="pJoinBtn">들어가기</button>
      <p class="muted" id="pJoinMsg"></p>
    </div>
  </div>

  <div id="pWait" class="big-msg hide">
    <div>
      <div class="muted" id="pWName"></div>
      <h2 id="pWTitle">곧 시작해요</h2>
      <p class="muted" id="pWSub">선생님이 라운드를 시작하면 그림이 나타나요.</p>
      <div id="pWBoard" style="margin-top:18px"></div>
    </div>
  </div>

  <div id="pGame" class="hide">
    <div class="bar"><span class="phase" id="pPhase"></span><span class="sp"></span><span class="clock" id="pClock"></span></div>
    <div class="meter" id="pMeter"><i></i></div>
    <div class="stage" id="pStage"></div>
    <p class="rot muted">휴대폰을 가로로 돌리면 그림이 더 크게 보여요</p>
    <div class="tools" id="pTools">
      <span class="count" id="pCount"></span>
      <span class="muted" id="pHint"></span>
      <button class="btn red big" id="pSubmit">제출하기</button>
    </div>
  </div>

  <div id="pResult" class="hide">
    <div class="res">
      <div class="stage" id="pRStage"></div>
      <div class="card" style="text-align:center">
        <div class="muted">이번 라운드</div>
        <div class="score" id="pRScore"></div>
        <p id="pRDetail" style="font-size:18px;margin:8px 0"></p>
        <p class="muted" id="pRRank"></p>
      </div>
    </div>
  </div>
</section>

<div class="status hide" id="status"></div>
<div class="modal hide" id="modal"><div class="card"><p id="mText"></p><div class="row" style="justify-content:center"><button class="btn" id="mNo">취소</button><button class="btn red" id="mYes">확인</button></div></div></div>

<script src="peerjs.min.js"></script>
<script src="qrcode.js"></script>
<script>
{
/* ---------- 데이터: 슬라이드에서 뽑은 그림과 정답 위치 (0~1 비율 좌표: 중심x, 중심y, 반지름x, 반지름y) ---------- */
const ROUNDS = [
 {name:"연습",a:"img/r0a.jpg",b:"img/r0b.jpg",ar:1.975,ans:[[0.1222,0.1983,0.0747,0.1029],[0.3008,0.5288,0.0747,0.1029],[0.1222,0.8399,0.0747,0.1029]]},
 {name:"1라운드",a:"img/r1a.jpg",b:"img/r1b.jpg",ar:1.7758,ans:[[0.4793,0.1268,0.0738,0.0824],[0.3568,0.501,0.0738,0.0824],[0.7036,0.501,0.0738,0.0824]]},
 {name:"2라운드",a:"img/r2a.jpg",b:"img/r2b.jpg",ar:1.3393,ans:[[0.5167,0.2414,0.0738,0.0689],[0.3071,0.8881,0.0738,0.0689],[0.8705,0.5392,0.0738,0.0689]]},
 {name:"3라운드",a:"img/r3a.jpg",b:"img/r3b.jpg",ar:1.3393,ans:[[0.7482,0.2419,0.0435,0.053],[0.8804,0.779,0.0352,0.0488],[0.5357,0.6012,0.0357,0.0313]]},
 {name:"4라운드",a:"img/r4a.jpg",b:"img/r4b.jpg",ar:1.3393,ans:[[0.2305,0.3638,0.0381,0.0689],[0.8086,0.295,0.0581,0.0376],[0.6186,0.7669,0.049,0.0485],[0.5231,0.8342,0.0321,0.0348]]},
 {name:"5라운드",a:"img/r5a.jpg",b:"img/r5b.jpg",ar:1.8801,ans:[[0.0368,0.358,0.0368,0.051],[0.8847,0.358,0.0368,0.051],[0.9649,0.4182,0.0142,0.0367],[0.8621,0.5849,0.0142,0.0307]]}
];
const MAX_MARKS = 5;
const PREFIX = "spotdiff-kr-v1-";
const qs = new URLSearchParams(location.search);
const LOCAL = qs.has("local");           // ?local : 같은 컴퓨터 탭끼리 테스트용 (인터넷 불필요)
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const fmt = ms => {const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const show = (ids, on) => ids.forEach(id => $(id).classList.toggle("hide", !on));
function status(t){const el=$("status");el.textContent=t||"";el.classList.toggle("hide",!t)}
function ask(text){return new Promise(res=>{$("mText").textContent=text;$("modal").classList.remove("hide");const done=v=>{$("modal").classList.add("hide");$("mYes").onclick=$("mNo").onclick=null;res(v)};$("mYes").onclick=()=>done(true);$("mNo").onclick=()=>done(false)})}

/* ---------- 채점: 정답 원 하나당 한 번만 인정, 나머지는 오답 ---------- */
function grade(round, marks){
  const R = ROUNDS[round], used = new Set(); let correct = 0;
  const res = marks.map(m => {
    let best=-1, bd=9;
    R.ans.forEach(([cx,cy,rx,ry],i)=>{
      if(used.has(i)) return;
      const RX=Math.max(rx*1.2,0.03), RY=Math.max(ry*1.2,0.03*R.ar);
      const d=((m.x-cx)/RX)**2+((m.y-cy)/RY)**2;
      if(d<=1 && d<bd){bd=d;best=i}
    });
    if(best>=0){used.add(best);correct++;return true}
    return false;
  });
  const wrong = marks.length - correct;
  return {correct, wrong, score: correct - wrong, hits: res};
}

/* ---------- 그림 + 표시 그리기 ---------- */
function stage(el, round, which, opt={}){
  const R = ROUNDS[round];
  el.style.aspectRatio = R.ar;
  let svg = "";
  if(opt.dots) svg += opt.dots.map(d=>`<circle class="dot" cx="${d.x*100}" cy="${d.y*100/R.ar}" r="0.7"/>`).join("");
  if(opt.ans) svg += R.ans.map(([cx,cy,rx,ry],i)=>`<ellipse class="ans" style="animation-delay:${i*.35}s" cx="${cx*100}" cy="${cy*100/R.ar}" rx="${rx*100}" ry="${ry*100/R.ar}"/>`).join("");
  if(opt.marks) svg += opt.marks.map((m,i)=>{const cls=opt.hits?(opt.hits[i]?" ok":" bad"):"";return `<circle class="mk${cls}" cx="${m.x*100}" cy="${m.y*100/R.ar}" r="3.2"/><text class="mkn" x="${m.x*100}" y="${m.y*100/R.ar}" font-size="3">${i+1}</text>`}).join("");
  const key=round+which;
  if(el.dataset.k!==key){el.dataset.k=key;el.innerHTML=`<img src="${which==="a"?R.a:R.b}" alt="" draggable="false"><svg viewBox="0 0 100 ${100/R.ar}" preserveAspectRatio="none"></svg>`}
  el.querySelector("svg").innerHTML=svg;
}
function preload(){ROUNDS.forEach(r=>{new Image().src=r.a;new Image().src=r.b})}

/* ---------- 사운드 (선생님 화면만) ---------- */
let actx=null;
function beep(f=880,d=.12,v=.15){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

/* ---------- 연결 (PeerJS 또는 로컬 탭 테스트) ---------- */
function hostLink(code, onMsg, onReady, onFail){
  if(LOCAL){
    const bc=new BroadcastChannel("sd-"+code);
    bc.onmessage=e=>{const m=e.data;if(m.to==="host")onMsg(m.from,m.data)};
    setTimeout(onReady,0);
    return {send:(to,d)=>bc.postMessage({to,data:d}),close:()=>bc.close()};
  }
  const conns=new Map();
  const peer=new Peer(PREFIX+code,{debug:0});
  peer.on("open",onReady);
  peer.on("error",e=>onFail(e.type||String(e)));
  peer.on("disconnected",()=>{status("연결 서버와 끊김 — 다시 연결 중…");setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on("open",()=>status(""));
  peer.on("connection",c=>{
    c.on("open",()=>conns.set(c.peer,c));
    c.on("data",d=>{conns.set(c.peer,c);onMsg(c.peer,d)});
    c.on("close",()=>{conns.delete(c.peer);onMsg(c.peer,{t:"bye"})});
  });
  return {send:(to,d)=>{const c=conns.get(to);if(c&&c.open)try{c.send(d)}catch(e){}},close:()=>peer.destroy()};
}
function playerLink(code, onMsg, onState){
  if(LOCAL){
    const me="tab-"+Math.random().toString(36).slice(2,8), bc=new BroadcastChannel("sd-"+code);
    bc.onmessage=e=>{if(e.data.to===me)onMsg(e.data.data)};
    setTimeout(()=>onState("open"),0);
    return {send:d=>bc.postMessage({to:"host",from:me,data:d}),close:()=>bc.close()};
  }
  let peer=null, conn=null, dead=false, timer=null;
  const retry=ms=>{clearTimeout(timer);if(!dead)timer=setTimeout(go,ms)};
  function go(){
    if(dead) return;
    if(!peer||peer.destroyed){peer=new Peer({debug:0});peer.on("open",dial);peer.on("error",e=>{if(e.type==="peer-unavailable")onState("nohost");else onState("err");retry(2500)});peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});}
    else if(peer.open) dial();
  }
  function dial(){
    conn=peer.connect(PREFIX+code,{reliable:true});
    conn.on("open",()=>onState("open"));
    conn.on("data",onMsg);
    conn.on("close",()=>{onState("lost");retry(1500)});
  }
  go();
  return {send:d=>{if(conn&&conn.open)try{conn.send(d)}catch(e){}},close:()=>{dead=true;clearTimeout(timer);if(peer)peer.destroy()}};
}

/* ============================== 선생님 ============================== */
let H=null, link=null;
function newHostState(code){return {code,memo:120,find:60,players:{},order:[],phase:"lobby",round:-1,endsAt:0,startAt:0,subs:{},done:[],last:null}}
function saveH(){store.set("sd-host",H)}

function startHost(fresh){
  show(["vHome","vPlay"],false);show(["vHost"],true);preload();
  const old=store.get("sd-host");
  H=(!fresh&&old&&old.code)?old:newHostState(String(Math.floor(1000+Math.random()*9000)));
  if(["memo","find","locked"].includes(H.phase)) H.phase="lobby";   // 새로고침 중 진행 중이던 라운드는 취소
  Object.values(H.players).forEach(p=>p.conn=null);
  $("sMemo").value=H.memo;$("sFind").value=H.find;
  saveH();openRoom(0);renderHost();
}
function openRoom(tries){
  if(link) link.close();
  status("방 여는 중…");
  link=hostLink(H.code,onHostMsg,()=>{status("");renderHost()},type=>{
    if(type==="unavailable-id"){
      if(tries<8){status("방 코드를 다시 확보하는 중…");setTimeout(()=>openRoom(tries+1),3000)}
      else{H=newHostState(String(Math.floor(1000+Math.random()*9000)));saveH();openRoom(0);renderHost()}
    } else if(type==="network"||type==="server-error"||type==="socket-error"){status("인터넷 연결을 확인해 주세요 — 다시 시도 중…");setTimeout(()=>openRoom(tries),4000)}
  });
}
function onHostMsg(from, d){
  if(!d||typeof d!=="object") return;
  if(d.t==="bye"){const p=Object.values(H.players).find(p=>p.conn===from);if(p){p.conn=null;renderHost()}return}
  if(d.t==="hello"){
    const cid=String(d.cid||"").slice(0,40), name=String(d.name||"").trim().slice(0,10);
    if(!cid||!name) return;
    let p=H.players[cid];
    if(!p){p=H.players[cid]={name,total:0,hist:{}};H.order.push(cid)}
    p.name=name;p.conn=from;
    saveH();renderHost();sendState(cid);return;
  }
  if(d.t==="submit"){
    const cid=String(d.cid||""), p=H.players[cid];
    if(!p||d.round!==H.round||!["find","locked"].includes(H.phase)||H.subs[cid]) return;
    const marks=(Array.isArray(d.marks)?d.marks:[]).slice(0,MAX_MARKS).map(m=>({x:Math.min(1,Math.max(0,+m.x||0)),y:Math.min(1,Math.max(0,+m.y||0))}));
    H.subs[cid]={marks,ms:Date.now()-H.startAt};
    saveH();sendState(cid);renderHostSub();
    const online=H.order.filter(c=>H.players[c].conn);
    if(H.phase==="find"&&online.length&&online.every(c=>H.subs[c])) lockRound();
  }
}
function rankOf(cid){const t=H.players[cid].total;return 1+H.order.filter(c=>H.players[c].total>t).length}
function boardList(){return H.order.map(c=>({cid:c,...H.players[c]})).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name,"ko"))}
function sendState(cid){
  const p=H.players[cid]; if(!p||!p.conn) return;
  const m={t:"state",phase:H.phase,round:H.round,remain:H.endsAt?H.endsAt-Date.now():0,total:p.total,rank:rankOf(cid),n:H.order.length,name:p.name,submitted:!!H.subs[cid]};
  if(H.phase==="reveal"&&H.last){const r=H.last.rows.find(r=>r.cid===cid);m.result=r?{correct:r.correct,wrong:r.wrong,score:r.score,hits:r.hits,marks:r.marks,rank:r.rank,of:H.last.rows.length}:null}
  if(H.phase==="board"||H.phase==="lobby"){const bl=boardList();m.board=bl.slice(0,5).map(p=>({name:p.name,total:p.total,rank:1+bl.filter(q=>q.total>p.total).length}))}
  link.send(p.conn,m);
}
function broadcast(){H.order.forEach(sendState)}
function kick(cid){const p=H.players[cid];if(p&&p.conn)link.send(p.conn,{t:"kicked"});delete H.players[cid];H.order=H.order.filter(c=>c!==cid);saveH();renderHost()}

function startRound(r){
  beep(660,.2);
  H.memo=+$("sMemo").value;H.find=+$("sFind").value;
  H.round=r;H.phase="memo";H.subs={};H.endsAt=Date.now()+H.memo*1000;H.last=null;
  saveH();broadcast();renderHost();
}
function toFind(){H.phase="find";H.startAt=Date.now();H.endsAt=H.startAt+H.find*1000;beep(990,.25);saveH();broadcast();renderHost()}
function lockRound(){
  H.phase="locked";H.endsAt=0;saveH();broadcast();renderHost();
  setTimeout(reveal,1800);   // 늦게 도착하는 제출을 잠깐 기다림
}
function reveal(){
  if(H.phase!=="locked") return;
  const rows=H.order.map(cid=>{const s=H.subs[cid]||{marks:[],ms:null};const g=grade(H.round,s.marks);return {cid,name:H.players[cid].name,marks:s.marks,ms:s.ms,...g}});
  rows.sort((a,b)=>b.score-a.score||b.correct-a.correct||(a.ms??1e12)-(b.ms??1e12));
  rows.forEach((r,i)=>{r.rank=i+1;const p=H.players[r.cid];const prev=p.hist[H.round]||0;p.total+=r.score-prev;p.hist[H.round]=r.score});
  H.last={round:H.round,rows};
  if(!H.done.includes(H.round)) H.done.push(H.round);
  H.phase="reveal";saveH();broadcast();renderHost();beep(523,.15);setTimeout(()=>beep(784,.3),160);
}
function setPhase(ph){H.phase=ph;H.endsAt=0;saveH();broadcast();renderHost()}

let lastBeep=0;
setInterval(()=>{
  if(!H) return;
  const left=H.endsAt-Date.now();
  if(H.phase==="memo"||H.phase==="find"){
    $("hClock").textContent=fmt(left);
    $("hClock").classList.toggle("hot",left<10500);
    const tot=(H.phase==="memo"?H.memo:H.find)*1000;
    $("hMeter").firstElementChild.style.width=Math.max(0,left/tot*100)+"%";
    const s=Math.ceil(left/1000);if(s<=5&&s>0&&s!==lastBeep){lastBeep=s;beep(1200,.08,.1)}
    if(left<=0){H.phase==="memo"?toFind():lockRound()}
  }
},250);
setInterval(()=>{if(H&&link)broadcast()},5000);   // 끊겼다 들어온 아이도 화면이 맞도록

function renderHost(){
  const ph=H.phase, R=ROUNDS[H.round];
  const label={lobby:"대기실",memo:(R?R.name+" · ":"")+"기억하세요",find:(R?R.name+" · ":"")+"달라진 곳을 찾으세요",locked:"채점 중…",reveal:(R?R.name+" · ":"")+"정답 공개",board:"종합 순위"}[ph];
  $("hPhase").textContent=label;
  $("hCodeSm").textContent="코드 "+H.code;
  const online=H.order.filter(c=>H.players[c].conn).length;
  $("hCount").textContent=`참가 ${online}명`;
  show(["hLobby"],ph==="lobby");show(["hPlay"],["memo","find","locked"].includes(ph));
  show(["hReveal"],ph==="reveal");show(["hBoard"],ph==="board");
  show(["hMeter","hClock"],ph==="memo"||ph==="find");
  if(ph==="lobby"){
    $("hCode").textContent=H.code;
    const url=location.origin+location.pathname+"?code="+H.code+(LOCAL?"&local":"");
    $("hUrl").textContent=url;
    try{const q=qrcode(0,"M");q.addData(url);q.make();$("hQr").innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true})}catch(e){$("hQr").classList.add("hide")}
    $("hN").textContent=H.order.length?`(${H.order.length})`:"";
    $("hChips").innerHTML=H.order.length?H.order.map(c=>{const p=H.players[c];return `<span class="chip${p.conn?"":" off"}">${esc(p.name)} <span class="muted">${p.total}</span><button data-kick="${esc(c)}" aria-label="내보내기">×</button></span>`}).join(""):'<span class="muted">QR을 찍거나 코드를 입력하면 여기 이름이 나타나요.</span>';
    $("hRounds").innerHTML=ROUNDS.map((r,i)=>`<button class="rbtn${H.done.includes(i)?" done":""}" data-round="${i}"><img src="${r.a}" alt=""><span>${r.name}</span></button>`).join("");
  }
  if(["memo","find","locked"].includes(ph)){
    stage($("hStage"),H.round,ph==="memo"?"a":"b");
    $("hSkip").textContent=ph==="memo"?"바로 찾기 시작 →":"지금 마감 →";
    $("hSkip").disabled=ph==="locked";
    renderHostSub();
  }
  if(ph==="reveal"&&H.last){
    const rows=H.last.rows;
    stage($("hRStage"),H.last.round,"b",{ans:true,dots:rows.flatMap(r=>r.marks)});
    $("hRTitle").textContent=ROUNDS[H.last.round].name+" 결과";
    $("hRTable").innerHTML=rows.map(r=>`<tr class="${r.rank===1?"top1":""}"><td>${r.rank}</td><td>${esc(r.name)}</td><td>${r.correct}</td><td>${r.wrong}</td><td><b>${r.score>0?"+":""}${r.score}</b></td><td>${r.ms==null?"–":(r.ms/1000).toFixed(1)+"초"}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">참가자가 없어요</td></tr>';
  }
  if(ph==="board"){
    const bl=boardList();$("hBList").innerHTML=bl.map((p,i)=>{const rk=1+bl.filter(q=>q.total>p.total).length;return `<div class="brow${rk===1?" g1":""}" style="animation-delay:${Math.min(i,12)*.08}s"><span class="n">${rk}</span><span class="nm">${esc(p.name)}</span><span class="pt">${p.total}점</span></div>`}).join("")||'<p class="muted" style="text-align:center">아직 참가자가 없어요</p>';
  }
}
function renderHostSub(){
  const online=H.order.filter(c=>H.players[c].conn).length, n=Object.keys(H.subs).length;
  $("hSub").textContent=H.phase==="memo"?`${online}명이 보고 있어요`:`제출 ${n} / ${online}`;
}
$("hRounds").addEventListener("click",e=>{const b=e.target.closest("[data-round]");if(b)startRound(+b.dataset.round)});
$("hChips").addEventListener("click",async e=>{const b=e.target.closest("[data-kick]");if(!b)return;const p=H.players[b.dataset.kick];if(p&&await ask(`${p.name} 학생을 내보낼까요? 점수도 지워져요.`))kick(b.dataset.kick)});
$("hSkip").onclick=()=>{if(H.phase==="memo")toFind();else if(H.phase==="find")lockRound()};
$("hToBoard").onclick=()=>setPhase("board");
$("hToLobby").onclick=()=>setPhase("lobby");
$("hShowBoard").onclick=()=>setPhase("board");
$("hReset").onclick=async()=>{if(await ask("모든 학생의 점수와 완료 표시를 0으로 되돌릴까요?")){Object.values(H.players).forEach(p=>{p.total=0;p.hist={}});H.done=[];saveH();broadcast();renderHost()}};
$("hNew").onclick=async()=>{if(await ask("새 방을 만들까요? 지금 참가자와 점수는 모두 사라져요.")){store.del("sd-host");if(link)link.close();link=null;startHost(true)}};
$("sMemo").onchange=$("sFind").onchange=()=>{H.memo=+$("sMemo").value;H.find=+$("sFind").value;saveH()};

/* ============================== 학생 ============================== */
let P={cid:null,name:"",code:"",st:null,endsAt:0,marks:[],round:-1,submitted:false}, plink=null;
function startPlayer(){
  show(["vHome","vHost"],false);show(["vPlay"],true);preload();
  const saved=LOCAL?{}:(store.get("sd-player")||{});   // 로컬 테스트는 탭마다 다른 학생
  P.cid=saved.cid||("c"+Math.random().toString(36).slice(2,12));
  $("pCode").value=qs.get("code")||saved.code||"";
  $("pName").value=saved.name||"";
  pView("join");
  if(saved.code&&saved.name&&qs.get("code")===saved.code) join();   // 새로고침하면 자동 재입장
}
function join(){
  const code=$("pCode").value.replace(/\D/g,""), name=$("pName").value.trim();
  if(code.length!==4){$("pJoinMsg").textContent="코드 4자리를 입력하세요.";return}
  if(!name){$("pJoinMsg").textContent="이름을 입력하세요.";return}
  P.code=code;P.name=name;store.set("sd-player",{cid:P.cid,code,name});
  const d=store.get("sd-draft");if(d&&d.code===code){P.round=d.round;P.marks=d.marks||[]}
  $("pJoinMsg").textContent="연결하는 중…";$("pJoinBtn").disabled=true;
  if(plink) plink.close();
  plink=playerLink(code,onPlayerMsg,s=>{
    if(s==="open"){status("");plink.send({t:"hello",cid:P.cid,name:P.name})}
    else if(s==="nohost"){if(!P.st){$("pJoinMsg").textContent="방을 찾을 수 없어요. 코드를 확인하세요. (다시 시도 중…)";$("pJoinBtn").disabled=false}else status("선생님 화면과 연결이 끊겼어요 — 다시 연결 중…")}
    else status("연결이 끊겼어요 — 다시 연결 중…");
  });
}
function onPlayerMsg(m){
  if(!m||typeof m!=="object") return;
  if(m.t==="kicked"){plink.close();plink=null;P.st=null;store.del("sd-player");pView("join");$("pJoinMsg").textContent="선생님이 내보냈어요. 이름을 확인하고 다시 들어오세요.";$("pJoinBtn").disabled=false;return}
  if(m.t!=="state") return;
  const prev=P.st; P.st=m;
  P.endsAt=Date.now()+(m.remain||0);
  if(m.round!==P.round){P.round=m.round;P.marks=[];saveDraft()}
  if(m.phase==="memo"&&P.marks.length){P.marks=[];saveDraft()}
  if(!prev||prev.phase!==m.phase||prev.round!==m.round) P.tot=m.remain||0;
  P.submitted=m.submitted||(P.submitted&&prev&&prev.phase===m.phase&&prev.round===m.round);
  if(m.phase==="locked"&&!m.submitted) submit();
  const same=prev&&prev.phase===m.phase&&prev.round===m.round&&prev.submitted===m.submitted&&prev.total===m.total&&prev.rank===m.rank&&prev.n===m.n;
  if(!same) renderPlayer();
}
function saveDraft(){store.set("sd-draft",{code:P.code,round:P.round,marks:P.marks})}
function submit(){if(!plink)return;plink.send({t:"submit",cid:P.cid,round:P.round,marks:P.marks});P.submitted=true;renderPlayer()}
function pView(v){show(["pJoin"],v==="join");show(["pWait"],v==="wait");show(["pGame"],v==="game");show(["pResult"],v==="result")}
function renderPlayer(){
  const m=P.st; if(!m) return;
  $("pJoinBtn").disabled=false;$("pJoinMsg").textContent="";
  const R=ROUNDS[m.round];
  if(m.phase==="lobby"||m.phase==="board"){
    pView("wait");
    $("pWName").textContent=`${m.name} · ${m.total}점 · ${m.n}명 중 ${m.rank}등`;
    $("pWTitle").textContent=m.phase==="board"?"종합 순위":"곧 시작해요";
    $("pWSub").textContent=m.phase==="board"?"":"선생님이 라운드를 시작하면 그림이 나타나요.";
    $("pWBoard").innerHTML=m.phase==="board"&&m.board?m.board.map((p,i)=>`<div class="brow${p.rank===1?" g1":""}" style="animation-delay:${i*.08}s;text-align:left"><span class="n">${p.rank}</span><span class="nm">${esc(p.name)}</span><span class="pt">${p.total}점</span></div>`).join(""):"";
    return;
  }
  if(m.phase==="reveal"){
    pView("result");
    const r=m.result;
    stage($("pRStage"),m.round,"b",{ans:true,marks:r?r.marks:[],hits:r?r.hits:[]});
    $("pRScore").textContent=r?(r.score>0?"+":"")+r.score:"0";
    $("pRScore").style.color=r&&r.score>0?"var(--ok)":r&&r.score<0?"var(--bad)":"var(--ink)";
    $("pRDetail").textContent=r?`정답 ${r.correct}개 · 오답 ${r.wrong}개`:"이번 라운드는 참여하지 않았어요";
    $("pRRank").textContent=r?`이번 라운드 ${r.of}명 중 ${r.rank}등 · 누적 ${m.total}점`:`누적 ${m.total}점`;
    return;
  }
  pView("game");
  const memo=m.phase==="memo", locked=m.phase==="locked"||P.submitted;
  $("pPhase").textContent=R.name+" · "+(memo?"기억하세요":locked?"제출 완료":"달라진 곳은?");
  stage($("pStage"),m.round,memo?"a":"b",{marks:memo?null:P.marks});
  $("pStage").style.cursor=memo||locked?"default":"crosshair";
  show(["pTools"],!memo);
  $("pCount").innerHTML=`표시 <b>${P.marks.length}</b> / ${MAX_MARKS}`;
  $("pHint").textContent=locked?"결과를 기다리는 중…":"표시를 다시 누르면 지워져요";
  $("pSubmit").disabled=locked;
  $("pSubmit").textContent=locked?"제출 완료":"제출하기";
}
$("pStage").addEventListener("pointerdown",e=>{
  const m=P.st; if(!m||m.phase!=="find"||P.submitted) return;
  const R=ROUNDS[m.round], b=$("pStage").getBoundingClientRect();
  const x=(e.clientX-b.left)/b.width, y=(e.clientY-b.top)/b.height;
  if(x<0||x>1||y<0||y>1) return;
  const hit=P.marks.findIndex(k=>Math.hypot(k.x-x,(k.y-y)/R.ar)<0.035);
  if(hit>=0) P.marks.splice(hit,1);
  else if(P.marks.length<MAX_MARKS) P.marks.push({x:+x.toFixed(4),y:+y.toFixed(4)});
  else {$("pHint").textContent="5개까지만 표시할 수 있어요. 지울 표시를 먼저 누르세요.";return}
  saveDraft();renderPlayer();
});
$("pSubmit").onclick=async()=>{if(P.submitted)return;if(await ask(P.marks.length?`${P.marks.length}개를 제출할까요? 제출하면 바꿀 수 없어요.`:"아무것도 표시하지 않았어요. 그래도 제출할까요?"))submit()};
$("pJoinBtn").onclick=join;
$("pName").addEventListener("keydown",e=>{if(e.key==="Enter")join()});
$("pCode").addEventListener("input",()=>{$("pCode").value=$("pCode").value.replace(/\D/g,"").slice(0,4)});
setInterval(()=>{
  const m=P.st;if(!m||(m.phase!=="memo"&&m.phase!=="find"))return;
  const left=P.endsAt-Date.now();
  $("pClock").textContent=fmt(left);$("pClock").classList.toggle("hot",left<10500);
  $("pMeter").firstElementChild.style.width=(P.tot?Math.max(0,left/P.tot*100):100)+"%";
},250);

/* ---------- 시작 ---------- */
$("goHost").onclick=()=>startHost(false);
$("goPlay").onclick=startPlayer;
if(qs.get("code")) startPlayer();
else if(qs.has("host")) startHost(false);
}
</script>
</body>
</html>
